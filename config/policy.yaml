# ─────────────────────────────────────────────────────────────────────
# 路由与配额策略（改完在管理台点"重载配置"，不用重启）
# ─────────────────────────────────────────────────────────────────────

credit_usd: 0.001             # 1 credit = $0.001 标价用量（订阅渠道也按标价折算，用户额度与内部走哪家无关）
timezone: Europe/Amsterdam    # 每日额度在这个时区的 0 点重置

keys:                         # 新建 key 的默认值，管理台可逐个修改
  # 1M 上下文下这个数字要重新算：一次 90 万 token 的请求按 DeepSeek Flash 标价约 136 credits
  # （峰时 ×2 约 272），500 的话一天不到四次。2000 ≈ 每天 $2 标价用量；
  # 实付远低于此（前缀缓存命中 50 倍差价 + 订阅额度）。上线前按真实定价重算。
  daily_credits: 2000         # 每日额度；0 = 冻结（不是不限）
  rpm: 60                     # 每分钟请求数，至少 1
  max_concurrency: 4          # 同时进行的请求数，至少 1
  max_output_tokens: 32768    # 单次输出上限，0 = 只受每日额度实时截断
  plan: standard              # standard | pro
  exhaust_mode: economy       # economy：超额后只用经济档；reject：直接 429
  soft_ratio: 0.8             # 用到 80% 起加重成本权重（更倾向便宜模型）
  grace_ratio: 0.15           # 超过 100% 后经济档还能再用 15%
  economy_max_credits: 3      # 经济档单次请求的预估上限
  allowed_regions:            # 新建 key 的区域白名单，留空 = 不限；例：[eu] 只走欧盟渠道


global:
  daily_metered_usd_cap: 20   # 按量渠道每日总花费上限（保护你的钱包），0 = 不限
  long_context_tokens: 120000  # 超过这个输入长度按 long 任务打分（不是上限）
  min_context_tokens: 1000000  # 只对接原生上下文 ≥ 1M 的模型；不足的 offer 被硬过滤，启动时会列出来
  # 但"要多大窗口"是每个请求自己的事，不是全局的事。闲聊和小工具的输入本来就只有几 K，
  # 对它们要求 1M 等于白白扔掉又快又便宜的候选（minimax-m3：200K、$0.30、tps 90、
  # 首字 1.1s，而且已经在 Go 订阅里付过钱了）。装不下的候选仍然会被 router 里那条
  # 按本次输入算的 room 检查挡掉，所以"任何 1M 以内的请求都能跑"这个承诺不受影响。
  # 想完全回到"只碰 1M 模型"：把下面这行删掉或留空。
  min_context_exempt_tasks: [chat, utility]
  prefill_tps: 25000           # 预填充速度估计：首 token 超时 = 任务基准 + 输入 token / 这个值
  stream_idle_timeout_s: 120  # 流式输出中途卡住多久算失败
  max_attempts: 3             # 首 token 前最多尝试几个候选
  session_ttl_s: 1800
  max_request_mb: 32          # 单个请求体上限（1M token 的正文约 3-5MB，留足余量）
  # 客户端点名未知模型时：reject = 404（配置写错能立刻发现），route = 退回自动路由（drop-in 兼容）
  unknown_model: reject
  auth_fail_per_min: 20       # 同一 IP 每分钟允许的鉴权失败次数（防止用随机 key 刷库）

# 订阅额度的"影子价格"：额度闲着就几乎免费地用，快见底时按标价甚至更贵来算，
# 于是便宜的闲聊自然溢出到按量渠道，稀缺的订阅额度留给写代码和 agent。
subscription_pacing:
  floor: 0.05                 # 窗口用量 < knee 时按标价的 5% 计成本
  knee: 0.5
  full: 0.85                  # 用到 85% 时按标价 100% 计，之后继续变贵
  safety: 0.97                # 预计超过 97% 的候选直接排除
  # 1M 上下文下单次请求就可能吃掉 5 小时窗口的三成，而窗口还空着时累计压力仍在膝点
  # 以下、拿到地板价。单次占比超过这个数就按 (占比/阈值)² 抬价，自然溢出到按量渠道。
  single_share: 0.15
  # 价格曲线的形状是 exp(κ(u − full))，κ 由上面三个数反解（在线预算分配的最优折价
  # 函数是指数型，不是分段二次），并且按本次消耗的区间取平均而非取一点的边际价。
  # adaptive 则用对偶镜像下降在线学习"价格水平"λ：消耗速率超过窗口可持续速率就涨价。
  # 好处是 knee/full 只决定形状，真正的价格由你的实际流量定，不用猜。
  adaptive: true
  eta: 0.05                   # 学习率；调大反应快但会抖
  lam_min: 0.2
  lam_max: 5.0

breaker:
  threshold: 3                # 连续失败几次熔断
  base_cooldown_s: 30
  max_cooldown_s: 600

learning:                     # 隐式反馈（只用标记，不存内容）
  enabled: true
  regenerate_window_s: 180    # 同一会话这么久内重新生成同一问题 = 上次模型没答好
  correction_window_s: 900    # 上次回答后这么久内用户说"不对/还是报错/klopt niet" = 被纠正，并把难度 +1
  penalty: 0.15               # 单次扣分基准；工具参数非法 ×1.0，被纠正 ×0.7，JSON 不合规/空回复 ×0.6
  max_down: 1.5
  max_up: 0.3

# 对冲请求：首 token 迟迟不来时，同时向另一个渠道再发一次，谁先出字用谁。
# 只对等待敏感、单次很便宜的任务开启；落败的请求由网关承担其输入成本，不计入用户额度。
hedge:
  enabled: true
  tasks: [chat, utility]
  min_delay_ms: 800           # 至少等这么久才发第二个
  ttft_factor: 2.0            # 或者等到首选候选平均首 token 时间的 2 倍（取较大者）
  max_extra_credits: 2        # 第二个候选预估超过这个 credits 就不对冲

# 验证失败后的定向重试。本地验证器（verify.py）判定这次回答结构上不合格时，换一个
# 模型重做一次。换谁按 Weitzman 的保留值规则：σ = 质量价值 − (成本+等待)/(1−坏比率)，
# 取 σ 最大且 σ>0 的候选；没有正的 σ 就不重试。被丢弃的那次由网关承担，不计入用户额度。
# 只在"面向机器消费"的回答上做：工具调用或 response_format —— 客户端拿不到半个工具
# 调用，所以先缓冲再决定不影响体验；给人读的散文一旦开始流就不能收回。
verify_retry:
  enabled: true
  flags: [tool_args_invalid, tool_schema_invalid, json_invalid, empty]
  max_credits: 8              # 重试候选的单次预估上限
  buffer_kb: 64               # 缓冲超过这么多就放弃重试、恢复真正的流式

# 任务价值表（下标 = 难度 1/2/3）
#   need            该难度"够用"的质量分；超出部分只按 35% 计价值，不足部分按 150% 扣
#   usd_per_point   每 1 分质量值多少美元 —— 越高越舍得用贵模型
#   usd_per_sec     每秒等待折合多少美元 —— 越高越偏向快模型（死线之内的次要偏好）
#   deadline_s      预计总耗时超过它的候选先排除；全都超线时退化成"选最快的"。
#                   thalamus/fast 会把死线再除以 3。0 = 不设
#   est_output      预估输出 token，用于事前估算成本
tasks:
  utility: {need: [5.5, 6.5, 7.0], usd_per_point: [0.00005, 0.0002, 0.0005], usd_per_sec: 0.0001,  est_output: [150, 400, 800],   first_token_timeout_s: 10, deadline_s: 20}
  chat:    {need: [6.5, 7.5, 8.3], usd_per_point: [0.0002, 0.001, 0.004],   usd_per_sec: 0.0003,  est_output: [400, 900, 1800],  first_token_timeout_s: 12, deadline_s: 25}
  # code/agent 这两行调过三次，经验都写在这里，别再重犯：
  #
  # ① need/1 不能高于便宜模型的分数。曾经把 code/1 的 need 提到 7.8，于是 7.3 分的
  #    deepseek-flash 每次都吃 1.5 倍的"不足"惩罚 —— 等于宣布便宜模型永远不配写代码。
  #    而校准实测它在两道代码题上都是 10/10，和所有贵模型一样。
  # ② usd_per_point 不能调太高。质量差是固定值，成本差随输入长度线性放大：30 token 时
  #    kimi 与 deepseek-flash 只差 $0.0001，到 58K（真实 p50）就差 $0.054。把每分价值
  #    提高等于永久放大那个固定值，于是大上下文下成本再也压不过它 —— 实测一回合
  #    （8.6 次调用）标价从 $0.087 涨到 $0.551，5 小时窗口只够 22 个回合。
  # ③ usd_per_sec 必须比闲聊高，不是低。agent 一回合平均 8.6 次调用（实测），
  #    每秒延迟要乘 8.6 倍才是用户感知。曾经配成 0.0002（比 chat 的 0.0003 还低），
  #    直接造成端到端 30 秒以上。
  # ④ 这张表很陡（每分价值 1→3 跳 7.5 倍），所以难度判错一档就是成本翻几倍。
  #    2026-10-06 的事故正是这样：难度被"请求有多大"（声明了几个工具、上下文多长）
  #    抬到 3，于是同一句"跑一下测试"从 deepseek-flash 变成 kimi，一回合 $0.08 → $0.54。
  #    修在 intent.py（难度只看任务本身），不是修在这张表。改这几个数之前先确认分类对不对。
  # 分工：死线管"绝对不能接受"（硬排除），usd_per_sec 只在可接受的候选之间做温和偏好。
  # 把 usd_per_sec 调到 0.0015 时，小请求的等待成本（$0.0164）超过了整个质量价值
  # （$0.0109），code 任务就退化成"只挑最快的" —— 那是另一个方向的过头。
  code:    {need: [7.2, 8.0, 8.7], usd_per_point: [0.0015, 0.005, 0.015],   usd_per_sec: 0.0008,  est_output: [800, 2000, 4000], first_token_timeout_s: 25, deadline_s: 20}
  agent:   {need: [7.4, 8.0, 8.7], usd_per_point: [0.002, 0.006, 0.015],    usd_per_sec: 0.0012,  est_output: [500, 900, 1500],  first_token_timeout_s: 30, deadline_s: 15}
  reason:  {need: [7.0, 8.0, 8.8], usd_per_point: [0.001, 0.006, 0.02],     usd_per_sec: 0.00005, est_output: [1200, 3000, 6000], first_token_timeout_s: 45}
  vision:  {need: [6.5, 7.5, 8.0], usd_per_point: [0.0005, 0.002, 0.006],   usd_per_sec: 0.0002,  est_output: [300, 800, 1500],  first_token_timeout_s: 20}
  long:    {need: [7.0, 7.8, 8.5], usd_per_point: [0.002, 0.008, 0.02],     usd_per_sec: 0.00005, est_output: [800, 1500, 3000], first_token_timeout_s: 60}
