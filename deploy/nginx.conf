# Thalamus v3 的 nginx 反代配置（/etc/nginx/sites-available/thalamus）
#
# nginx 的几个默认值会直接伤到这个网关，务必按下面配：
#   1. proxy_buffering on（默认）→ SSE 被缓冲，首 token 延迟全废
#   2. 不设 proxy_http_version 1.1 + Connection ""（默认 1.0）→ 到应用的连接每次重建
#   3. client_max_body_size 1m（默认）→ 长上下文请求直接 413
#   4. proxy_read_timeout 60s（默认）→ 1M 上下文预填充几十秒时被掐断
#   5. $proxy_add_x_forwarded_for 会把客户端伪造的 XFF 一起带上 → 按 IP 限流被绕过

upstream thalamus_app {
    server 127.0.0.1:9880;
    keepalive 32;          # 复用到应用的长连接，省掉每请求一次握手
    keepalive_timeout 120s;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;          # ← 改成你的域名

    # certbot 会自己填这两行
    # ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # TLS 会话复用：跨洲场景下一次握手就是 ~400ms，命中与否是肉眼可见的差别
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    # 请求体：要 ≥ 网关的 global.max_request_mb（默认 32）
    client_max_body_size 40m;
    client_body_timeout  300s;

    # ── 以下 proxy_* 在 server 层设置，两个 location 都会继承 ──
    proxy_http_version 1.1;
    proxy_set_header Connection "";        # 清掉 close，keepalive 才生效
    proxy_buffering off;                   # SSE 必须：不缓冲响应
    proxy_request_buffering off;           # 大 body 不先落盘
    proxy_read_timeout  600s;              # 长上下文预填充可能几十秒
    proxy_send_timeout  600s;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 覆盖而不是追加：客户端自己写的 X-Forwarded-For 不可信（网关按它限流）。
    # 配合 uvicorn 的 THALAMUS_TRUSTED_PROXIES=127.0.0.1（默认值）。
    proxy_set_header X-Forwarded-For    $remote_addr;

    # 管理控制台：只允许你自己的 IP。应用层的 THALAMUS_ADMIN_ALLOW 是第二道。
    location /admin {
        allow 203.0.113.10;                # ← 改成你的公网 IP，可写多行
        deny all;
        proxy_pass http://thalamus_app;
    }

    # Prometheus 抓取（需要 Bearer token）；不想暴露就整段删掉
    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://thalamus_app;
    }

    location / {
        proxy_pass http://thalamus_app;
    }
}

# 检查与生效：
#   nginx -t && systemctl reload nginx
# 自检 SSE 没被缓冲（应该逐块出现，而不是最后一次性吐出来）：
#   curl -N -s -H "Authorization: Bearer <key>" -H 'content-type: application/json' \
#     -d '{"model":"thalamus/auto","stream":true,"messages":[{"role":"user","content":"数到十"}]}' \
#     https://api.example.com/v1/chat/completions
