<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thalamus 控制台</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--text:#1c2230;--muted:#687186;--line:#e3e6eb;--soft:#f0f2f5;
  --accent:#3552d6;--accent-weak:#e9edff;--ok:#2b8a3e;--ok-weak:#e6f4ea;--warn:#b35c00;--warn-weak:#fff1df;
  --bad:#c92a2a;--bad-weak:#fdeaea;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1116;--panel:#171a21;--text:#e5e8ef;--muted:#98a1b3;--line:#292e39;--soft:#1e222b;
  --accent:#8198ff;--accent-weak:#1e2542;--ok:#5ad07a;--ok-weak:#16291c;--warn:#ffb057;--warn-weak:#2e2213;
  --bad:#ff7070;--bad-weak:#2f1717;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:0 20px;height:54px}
.brand{font-weight:650;white-space:nowrap}.brand small{color:var(--muted);font-weight:400;margin-left:6px}
nav{display:flex;gap:2px;overflow-x:auto;flex:1}
nav button{background:none;border:0;padding:7px 12px;border-radius:7px;color:var(--muted);cursor:pointer;font:inherit;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
main{max-width:1320px;margin:0 auto;padding:20px}
h2{font-size:15px;margin:26px 0 10px;font-weight:620}
h2:first-child{margin-top:0}
.muted{color:var(--muted)}.mono{font-family:var(--mono);font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .k{color:var(--muted);font-size:12.5px}.stat .v{font-size:22px;font-weight:620;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{color:var(--muted);font-size:12px;margin-top:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-weight:560;color:var(--muted);font-size:12.5px;background:var(--soft)}
tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:180px}
.num{text-align:right}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--soft);color:var(--muted)}
.badge.ok{background:var(--ok-weak);color:var(--ok)}.badge.warn{background:var(--warn-weak);color:var(--warn)}
.badge.bad{background:var(--bad-weak);color:var(--bad)}.badge.acc{background:var(--accent-weak);color:var(--accent)}
.meter{height:7px;background:var(--soft);border-radius:99px;overflow:hidden;min-width:90px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter i.warn{background:var(--warn)}.meter i.bad{background:var(--bad)}
button.btn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:6px 12px;border-radius:7px;cursor:pointer;font:inherit;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12.5px}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 10px;width:100%}
textarea{min-height:110px;resize:vertical;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.c{display:flex;align-items:center;gap:6px;font-size:13px}
label.c input{width:auto}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.warnbox{background:var(--warn-weak);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.cap{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.cap .w{display:grid;grid-template-columns:48px 1fr 150px;gap:10px;align-items:center;margin-top:8px;font-size:12.5px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:0;width:min(720px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,12,18,.45)}
.dh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:620}
.db{padding:16px 18px;overflow:auto;max-height:70vh}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.secret{font-family:var(--mono);background:var(--soft);padding:12px;border-radius:8px;word-break:break-all;user-select:all}
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
#toast div{background:var(--text);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;max-width:420px}
#toast div.err{background:var(--bad);color:#fff}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:40}
#login .card{width:min(380px,92vw);padding:26px}
.hide{display:none!important}
.why{color:var(--muted);font-size:12px}
@media (max-width:640px){main{padding:14px}.bar{gap:10px;padding:0 12px}.brand small{display:none}}
</style>
</head>
<body>
<div id="login" class="hide">
  <form class="card" id="loginForm">
    <div style="font-weight:650;font-size:17px;margin-bottom:4px">Thalamus 控制台</div>
    <div class="muted" id="loginHint" style="margin-bottom:16px"></div>
    <input type="text" id="loginTotp" placeholder="6 位验证码" inputmode="numeric" autocomplete="one-time-code"
           pattern="[0-9]*" maxlength="6" class="hide">
    <input type="password" id="loginToken" placeholder="管理口令" autocomplete="current-password">
    <button class="btn primary" style="width:100%;margin-top:12px">登录</button>
    <div id="loginErr" class="why" style="color:var(--bad);margin-top:8px"></div>
  </form>
</div>

<header><div class="bar">
  <div class="brand">Thalamus<small id="ver"></small></div>
  <nav id="nav">
    <button data-v="overview" class="active">概览</button>
    <button data-v="keys">Key 管理</button>
    <button data-v="channels">渠道</button>
    <button data-v="requests">请求日志</button>
    <button data-v="preview">路由试算</button>
    <button data-v="settings">学习与配置</button>
  </nav>
  <button class="btn sm" id="logout">退出</button>
</div></header>

<main id="main"></main>

<dialog id="dlg"><div class="dh" id="dlgTitle"></div><div class="db" id="dlgBody"></div><div class="df" id="dlgFoot"></div></dialog>
<div id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = (v, d = 0) => (v == null || isNaN(v)) ? "—" : Number(v).toLocaleString("zh-CN", {maximumFractionDigits: d, minimumFractionDigits: 0});
const usd = v => v == null ? "—" : "$" + Number(v).toFixed(Math.abs(v) < 0.01 ? 5 : 3);
const pct = v => v == null ? "—" : (v * 100).toFixed(1) + "%";
const TASK = {utility:"工具型", chat:"闲聊", code:"代码", agent:"Agent", reason:"推理", vision:"看图", long:"长文"};
const FLAG = {tool_args_invalid:["工具参数非法","bad"], tool_schema_invalid:["参数不合 schema","bad"], json_invalid:["JSON不合规","bad"],
  code_invalid:["代码语法错","warn"], empty:["空回复","bad"], truncated:["被截断","warn"],
  hedged:["对冲",""], quota_cut:["额度截断","warn"], user_correction:["被纠正","bad"], regenerated:["被重问","warn"]};
const flagBadges = raw => (raw || "").split(",").filter(Boolean).map(f => badge((FLAG[f] || [f])[0], (FLAG[f] || [,""])[1])).join(" ");
let CONFIG = null, VIEW = "overview", timer = null;

function toast(msg, err = false) {
  const d = document.createElement("div"); d.textContent = msg; if (err) d.className = "err";
  $("#toast").appendChild(d); setTimeout(() => d.remove(), err ? 6000 : 2800);
}
async function api(path, opts = {}) {
  const r = await fetch("/admin/api" + path, {
    method: opts.method || "GET", credentials: "same-origin",
    headers: opts.body ? {"Content-Type": "application/json"} : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (r.status === 401 && path !== "/login") { showLogin(); throw new Error("需要登录"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j?.error?.message || r.statusText);
  return j;
}
function ago(ts) {
  if (!ts) return "—";
  const s = Date.now() / 1000 - ts;
  if (s < 60) return Math.max(0, Math.floor(s)) + " 秒前";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  return Math.floor(s / 86400) + " 天前";
}
function dur(s) { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}小时${m}分` : `${m}分钟`; }
function meter(ratio) {
  const r = Math.max(0, Math.min(1, ratio || 0));
  const cls = ratio >= 1 ? "bad" : ratio >= .8 ? "warn" : "";
  return `<div class="meter"><i class="${cls}" style="width:${(r * 100).toFixed(1)}%"></i></div>`;
}
function badge(text, cls = "") { return `<span class="badge ${cls}">${esc(text)}</span>`; }
function table(cols, rows, empty = "暂无数据") {
  if (!rows.length) return `<div class="panel"><div class="empty">${empty}</div></div>`;
  return `<div class="panel scroll"><table><thead><tr>${cols.map(c => `<th class="${c.cls || ""}">${c.t}</th>`).join("")}</tr></thead>
  <tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${c.cls || ""}">${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function dialog(title, body, buttons) {
  $("#dlgTitle").textContent = title; $("#dlgBody").innerHTML = body; const foot = $("#dlgFoot"); foot.innerHTML = "";
  for (const b of buttons) {
    const el = document.createElement("button"); el.className = "btn " + (b.cls || ""); el.textContent = b.t;
    el.onclick = async () => { try { if (b.fn && (await b.fn()) === false) return; $("#dlg").close(); } catch (e) { toast(e.message, true); } };
    foot.appendChild(el);
  }
  $("#dlg").showModal();
}

/* ─────────── 登录 ─────────── */
/* 这两个常量由服务端在渲染时替换（见 api_admin.page）——静态文件无法知道运行期配置 */
const TOTP_ENABLED = __TOTP_ENABLED__, TOTP_ONLY = __TOTP_ONLY__;
function showLogin() {
  $("#login").classList.remove("hide");
  const totp = $("#loginTotp"), tok = $("#loginToken");
  totp.classList.toggle("hide", !TOTP_ENABLED);
  tok.classList.toggle("hide", TOTP_ONLY);
  tok.required = !TOTP_ONLY;
  $("#loginHint").textContent = TOTP_ONLY
    ? "输入 Authenticator 里的 6 位验证码"
    : TOTP_ENABLED ? "输入 6 位验证码，或用管理口令登录" : "输入 .env 里的 THALAMUS_ADMIN_TOKEN";
  (TOTP_ONLY ? totp : tok).focus();
  clearInterval(timer);
}
$("#loginForm").onsubmit = async e => {
  e.preventDefault(); $("#loginErr").textContent = "";
  const body = {};
  if (TOTP_ENABLED && $("#loginTotp").value.trim()) body.totp = $("#loginTotp").value.trim();
  if (!TOTP_ONLY) body.token = $("#loginToken").value;
  try { await api("/login", {method: "POST", body}); $("#login").classList.add("hide"); $("#loginToken").value = ""; $("#loginTotp").value = ""; boot(); }
  catch (err) { $("#loginErr").textContent = err.message; }
};
$("#logout").onclick = async () => { await api("/logout", {method: "POST"}).catch(() => {}); showLogin(); };

/* ─────────── 概览 ─────────── */
function capacityHtml(cap) {
  const entries = Object.entries(cap || {});
  if (!entries.length) return `<div class="panel"><div class="empty">没有订阅渠道</div></div>`;
  return `<div class="cap">${entries.map(([scope, c]) => `
    <div class="card">
      <div class="spread"><b>${esc(scope)}</b>${c.exhausted_until ? badge("上游报额度耗尽 · " + dur(c.exhausted_until - Date.now() / 1000) + "后重试", "bad") : badge("在途 " + n(c.inflight, 2))}</div>
      ${c.windows.map(w => `<div class="w"><span class="muted">${w.hours >= 24 ? n(w.hours / 24) + "天" : n(w.hours) + "h"}</span>${meter(w.ratio)}<span class="mono">${pct(w.ratio)} · ${n(w.used, 1)}/${n(w.limit)}</span></div>`).join("")}
    </div>`).join("")}</div>`;
}
async function viewOverview(el) {
  const o = await api("/overview");
  $("#ver").textContent = "v" + o.version;
  const g = o.today.global || {};
  const cacheRatio = (g.in_miss + g.in_cached) ? g.in_cached / (g.in_miss + g.in_cached) : null;
  const cap = o.metered_cap_usd;
  el.innerHTML = `
    ${o.warnings.length ? `<div class="warnbox">${o.warnings.map(esc).join("<br>")}</div>` : ""}
    <div class="spread" style="margin-bottom:10px"><h2 style="margin:0">今日 <span class="muted" style="font-weight:400">${esc(o.day)} · ${esc(o.timezone)} · ${dur(o.reset_in_s)}后重置</span></h2></div>
    <div class="cards">
      <div class="card stat"><div class="k">请求</div><div class="v">${n(g.n)}</div><div class="s">错误 ${n(g.errors)} · 换家 ${n(g.fallbacks)}</div></div>
      <div class="card stat"><div class="k">消耗 credits（标价）</div><div class="v">${n(g.credits, 1)}</div><div class="s">≈ ${usd((g.credits || 0) * 0.001)}</div></div>
      <div class="card stat"><div class="k">按量实付</div><div class="v">${usd(o.metered_usd_today)}</div><div class="s">${cap ? "上限 " + usd(cap) : "未设上限"}</div>${cap ? meter(o.metered_usd_today / cap) : ""}</div>
      <div class="card stat"><div class="k">缓存命中</div><div class="v">${pct(cacheRatio)}</div><div class="s">输入 ${n((g.in_miss || 0) + (g.in_cached || 0))} tokens</div></div>
      <div class="card stat"><div class="k">平均首 token</div><div class="v">${g.ttft_ms ? n(g.ttft_ms) + " ms" : "—"}</div><div class="s">在途 ${n(o.inflight)} · 会话 ${n(o.sessions)}</div></div>
      <div class="card stat"><div class="k">Key</div><div class="v">${n(o.keys_active_today)} <span class="muted" style="font-size:14px">/ ${n(o.keys_enabled)}</span></div><div class="s">今日活跃 / 启用</div></div>
    </div>
    <h2>订阅额度窗口</h2>${capacityHtml(o.capacity)}
    <h2>模型用量（今日）</h2>
    ${table([
      {t: "模型", f: r => `<b>${esc(r.model)}</b>`}, {t: "渠道", f: r => esc(r.channel)},
      {t: "请求", cls: "num", f: r => n(r.n)}, {t: "credits", cls: "num", f: r => n(r.credits, 1)},
      {t: "实付", cls: "num", f: r => usd(r.real_usd)}, {t: "订阅消耗", cls: "num", f: r => r.units ? n(r.units, 2) : "—"},
      {t: "首 token", cls: "num", f: r => n(r.ttft_ms) + " ms"},
    ], o.today.by_offer || [], "今天还没有请求")}
    <h2>质量信号（今日） <span class="muted" style="font-weight:400">不存内容，只记标记；比例越高说明这个模型在这类任务上越不可靠</span></h2>
    ${table([
      {t: "模型", f: r => `<b>${esc(r.model)}</b>`}, {t: "任务", f: r => TASK[r.task] || esc(r.task)},
      {t: "请求", cls: "num", f: r => n(r.n)},
      ...["tool_args_invalid", "json_invalid", "empty", "truncated", "user_correction", "regenerated", "hedged"].map(k => ({
        t: FLAG[k][0], cls: "num",
        f: r => r[k] ? `<span style="color:var(--${FLAG[k][1] === "bad" ? "bad" : FLAG[k][1] === "warn" ? "warn" : "muted"})">${n(r[k])} · ${pct(r[k] / r.n)}</span>` : '<span class="muted">0</span>',
      })),
    ], o.outcomes || [], "今天还没有请求")}
    <h2>任务分布</h2>
    <div class="chips">${(o.today.by_task || []).map(t => badge(`${TASK[t.task] || t.task || "被拒"} · 难度${t.difficulty ?? "-"} · ${t.n}`, "acc")).join("") || '<span class="muted">—</span>'}</div>`;
}

/* ─────────── Key ─────────── */
function keyForm(k = {}) {
  const d = CONFIG.key_defaults, v = (f) => k[f] ?? d[f] ?? "";
  const allowed = new Set(k.allowed_models || []);
  const regions = new Set(k.allowed_regions || (k.id ? [] : d.allowed_regions || []));
  return `<div class="form">
    <label class="f">名称<input id="kf_name" value="${esc(k.name || "")}" maxlength="80" placeholder="例如：张三 · Hermes"></label>
    <label class="f">每日额度（credits，0=冻结）<input id="kf_daily" type="number" min="0" step="1" value="${esc(v("daily_credits"))}"></label>
    <label class="f">每分钟请求（≥1）<input id="kf_rpm" type="number" min="1" value="${esc(v("rpm"))}"></label>
    <label class="f">并发（≥1）<input id="kf_conc" type="number" min="1" value="${esc(v("max_concurrency"))}"></label>
    <label class="f">单次输出上限（0=只按额度截断）<input id="kf_out" type="number" min="0" value="${esc(v("max_output_tokens"))}"></label>
    <label class="f">套餐<select id="kf_plan"><option value="standard">standard</option><option value="pro">pro（可用 pro 模型）</option></select></label>
    <label class="f">额度用完后<select id="kf_mode"><option value="economy">降到经济档继续用</option><option value="reject">直接拒绝</option></select></label>
    <label class="f">有效期（天，空=永久）<input id="kf_exp" type="number" min="0" placeholder="${k.expires_at ? "当前到 " + new Date(k.expires_at * 1000).toLocaleDateString() : "永久"}"></label>
  </div>
  <label class="f" style="margin-top:12px">备注<input id="kf_note" value="${esc(k.note || "")}" maxlength="500"></label>
  <div style="margin-top:14px" class="muted">允许的模型（都不勾 = 自动路由可用全部）</div>
  <div class="chips" style="margin-top:6px">${CONFIG.models.map(m => `<label class="c badge"><input type="checkbox" class="kf_m" value="${esc(m.key)}" ${allowed.has(m.key) ? "checked" : ""}>${esc(m.display)}${m.tier === "pro" ? " · pro" : ""}</label>`).join("")}</div>
  <div style="margin-top:14px" class="muted">允许的渠道区域（都不勾 = 不限；勾了就是硬约束，换家 / 对冲 / 降档都不会越界）</div>
  <div class="chips" style="margin-top:6px">${(CONFIG.regions || []).map(r => `<label class="c badge"><input type="checkbox" class="kf_r" value="${esc(r)}" ${regions.has(r) ? "checked" : ""}>${esc(r)}${(CONFIG.live_regions || []).includes(r) ? "" : " · 无可用渠道"}</label>`).join("") || '<span class="muted">—</span>'}</div>
  <p class="why">1 credit = $${CONFIG.credit_usd} 标价用量。DeepSeek Flash 一次普通对话约 0.3–1 credit，带 3 万 token 上下文的 agent 调用约 5–10 credit。</p>`;
}
function readKeyForm(creating) {
  const num = id => $(id).value === "" ? null : Number($(id).value);
  const models = [...document.querySelectorAll(".kf_m:checked")].map(x => x.value);
  const regions = [...document.querySelectorAll(".kf_r:checked")].map(x => x.value);
  const b = {
    allowed_regions: regions.length ? regions : null,
    name: $("#kf_name").value.trim(), daily_credits: num("#kf_daily"), rpm: num("#kf_rpm"), max_concurrency: num("#kf_conc"),
    max_output_tokens: num("#kf_out"), plan: $("#kf_plan").value, exhaust_mode: $("#kf_mode").value,
    note: $("#kf_note").value, allowed_models: models.length ? models : null,
  };
  if ($("#kf_exp").value !== "") b.expires_days = Number($("#kf_exp").value);
  if (!b.name) throw new Error("名称必填");
  return b;
}
function showSecret(title, key) {

      {t: "", f: k => `<div class="row">
        <button class="btn sm" data-a="edit" data-id="${k.id}">编辑</button>
        <button class="btn sm" data-a="usage" data-id="${k.id}">用量</button>

        <button class="btn sm" data-a="rotate" data-id="${k.id}">轮换</button>

    ], keys, "还没有 key，点右上角新建")}`;

      } else if (a === "usage") {

        ], u.history)}<h2>最近请求</h2>${reqTable(u.requests, false)}`, [{t: "关闭"}]);
      }
    } catch (e) { toast(e.message, true); }
  });

/* ─────────── 渠道 ─────────── */
const DIALECTS = {openai_chat: "OpenAI 兼容 (/chat/completions)", anthropic: "Anthropic (/messages)"};
const TASKS = ["utility", "chat", "code", "agent", "reason", "vision", "long"];

function addChannelForm() {

    <label class="f" style="grid-column:1/-1">Base URL（到 /chat/completions 之前的那一段）
      <input id="ch_url" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1"></label>
    <label class="f" style="grid-column:1/-1">API Key（存在服务器的运行时密钥库，只回显掩码）

    <label class="f">协议<select id="ch_dialect">${Object.entries(DIALECTS).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("")}</select></label>

}

function modelRow(m) {
  const id = esc(m.id);
  return `<tr data-id="${id}">
    <td><label class="row"><input type="checkbox" class="m_on" ${m.context ? "checked" : ""}><b>${id}</b></label>
        ${m.owned_by ? `<div class="why">${esc(m.owned_by)}</div>` : ""}</td>
    <td><input class="m_in" type="number" step="0.001" min="0" style="width:76px" placeholder="必填"></td>
    <td><input class="m_cached" type="number" step="0.001" min="0" style="width:76px" placeholder="=输入"></td>
    <td><input class="m_out" type="number" step="0.001" min="0" style="width:76px" placeholder="必填"></td>
    <td><input class="m_ctx" type="number" min="1024" style="width:104px" value="${m.context || ""}" placeholder="必填"></td>
    <td><input class="m_maxout" type="number" min="256" style="width:88px" value="8192"></td>
    <td><input class="m_q" type="number" step="0.1" min="0" max="10" style="width:64px" value="7"></td>
    <td><select class="m_reason" style="width:84px"><option value="none">不思考</option><option value="hybrid">可思考</option><option value="always">总思考</option></select></td>
    <td class="row"><label class="row"><input type="checkbox" class="m_tools" checked>工具</label>
        <label class="row"><input type="checkbox" class="m_vision">图片</label>
        <label class="row"><input type="checkbox" class="m_json" checked>JSON</label></td>
  </tr>`;
}

function readModels() {
  return [...document.querySelectorAll("#ch_models tbody tr")].filter(tr => $(".m_on", tr).checked).map(tr => {
    const v = (s, d) => { const x = $(s, tr).value; return x === "" ? d : Number(x); };
    const key = tr.dataset.id;
    const input = v(".m_in");
    if (input == null || isNaN(input) || v(".m_out") == null || isNaN(v(".m_out")) || !v(".m_ctx"))
      throw new Error(`${key}：输入价、输出价、上下文都必填`);
    return {
      key, upstream: key, display: key,
      price: {input, cached: v(".m_cached", input), output: v(".m_out")},
      context: v(".m_ctx"), max_output: v(".m_maxout", 8192), quality: v(".m_q", 7),
      reasoning: $(".m_reason", tr).value, tools: $(".m_tools", tr).checked, vision: $(".m_vision", tr).checked,
      json_mode: $(".m_json", tr).checked,
    };
  });
}

function wireAddChannel() {
  $("#ch_probe").onclick = async () => {
    const msg = $("#ch_probeMsg");
    msg.textContent = "探测中…";
    try {
      const r = await api("/channels/probe", {method: "POST", body: {
        base_url: $("#ch_url").value.trim(), api_key: $("#ch_key").value, dialect: $("#ch_dialect").value,
      }});
      if (!r.ok) { msg.innerHTML = badge("失败 " + (r.status || ""), "bad") + " " + esc((r.error || "").slice(0, 200)); return; }
      msg.innerHTML = badge(`连通，${r.count} 个模型`, "ok") + ' <span class="why">勾选要启用的，填上价格（USD / 1M token）</span>';
      $("#ch_models").innerHTML = r.models.length ? `<div class="panel scroll"><table><thead><tr>
        <th>模型</th><th>输入价</th><th>缓存价</th><th>输出价</th><th>上下文</th><th>单次输出上限</th><th>质量先验</th><th>思考</th><th>能力（JSON = 支持 response_format）</th>
        </tr></thead><tbody>${r.models.map(modelRow).join("")}</tbody></table></div>

  };
}

       ["usage", r.usage_missing ? badge("上游没返回 usage —— 计量会退回估算", "warn")
          : `<span class="mono">输入 ${r.usage.input_miss} / 缓存 ${r.usage.input_cached} / 输出 ${r.usage.output}</span>`],

/* ─────────── 请求日志 ─────────── */
function reqTable(rows, withKey = true) {
  const st = r => r.status === "ok" ? badge("成功", "ok") : r.status === "client_closed" ? badge("客户端断开", "warn") : r.status === "rejected" ? badge("拒绝", "warn") : badge(r.status, "bad");
  return table([
    {t: "时间", f: r => `<span title="${new Date(r.ts * 1000).toLocaleString()}">${ago(r.ts)}</span>`},
    ...(withKey ? [{t: "Key", f: r => `<span class="mono">${esc(r.key_id || "")}</span>`}] : []),
    {t: "任务", f: r => r.task ? `${TASK[r.task] || r.task} ${r.difficulty}` : "—"},
    {t: "模型", f: r => r.model ? `<b>${esc(r.model)}</b><div class="why">${esc(r.channel)}</div>` : "—"},
    {t: "credits", cls: "num", f: r => n(r.credits, 2)},
    {t: "实付", cls: "num", f: r => r.real_usd ? usd(r.real_usd) : "—"},
    {t: "tokens 入/缓存/出", cls: "num", f: r => `<span class="mono">${n(r.in_miss)}/${n(r.in_cached)}/${n(r.out_tokens)}</span>`},
    {t: "首 token", cls: "num", f: r => r.ttft_ms ? n(r.ttft_ms) + " ms" : "—"},
    {t: "耗时", cls: "num", f: r => n((r.duration_ms || 0) / 1000, 1) + " s"},
    {t: "尝试", cls: "num", f: r => r.attempts > 1 ? badge(r.attempts, "warn") : n(r.attempts)},
    {t: "状态", f: r => st(r) + (r.mode && r.mode !== "normal" ? " " + badge(r.mode, "warn") : "")},
    {t: "信号", f: r => flagBadges(r.flags) || '<span class="muted">—</span>'},
    {t: "路由理由 / 失败", cls: "wrap", f: r => `<span class="why">${esc(r.failure || r.reason || "")}</span>`},
  ], rows, "暂无请求");
}
async function viewRequests(el) {
  const keyId = el.dataset.key || "";
  const [{requests}, {keys}] = await Promise.all([api("/requests?limit=200" + (keyId ? "&key_id=" + encodeURIComponent(keyId) : "")), api("/keys")]);
  el.innerHTML = `<div class="spread" style="margin-bottom:12px"><h2 style="margin:0">最近 200 条请求</h2>
    <select id="rqKey" style="width:auto"><option value="">全部 key</option>${keys.map(k => `<option value="${k.id}" ${k.id === keyId ? "selected" : ""}>${esc(k.name)}</option>`).join("")}</select></div>
    <p class="why">网关不保存任何提示词或回复内容，这里只有计量与路由元数据。</p>${reqTable(requests)}`;
  $("#rqKey").onchange = e => { el.dataset.key = e.target.value; render(); };
}

async function viewPreview(el) {
  const {keys} = await api("/keys");
  el.innerHTML = `<h2>路由试算</h2><p class="muted">输入一条请求，看分类结果和每个候选的打分（不会真正调用上游）。</p>
    <div class="card">
      <label class="f">系统提示（可选）<textarea id="pvSys" style="min-height:60px"></textarea></label>
      <label class="f" style="margin-top:10px">用户消息<textarea id="pvMsg">帮我重构这个 Python 项目的鉴权模块，拆成中间件</textarea></label>
      <div class="row" style="margin-top:10px">
        <label class="c"><input type="checkbox" id="pvTools">带工具定义</label>
        <label class="c"><input type="checkbox" id="pvLoop">处于工具调用循环</label>
        <label class="c"><input type="checkbox" id="pvImg">附带一张图片</label>
        <label class="f" style="width:170px">额外上下文 tokens<input id="pvPad" type="number" min="0" value="0"></label>
        <label class="f" style="width:190px">model 字段<input id="pvModel" value="thalamus/auto"></label>
        <label class="f" style="width:190px">按 key 计算<select id="pvKey"><option value="">不限制（pro）</option>${keys.map(k => `<option value="${k.id}">${esc(k.name)}</option>`).join("")}</select></label>
        <button class="btn primary" id="pvGo" style="align-self:flex-end">试算</button>
      </div>
    </div><div id="pvOut"></div>`;
  $("#pvGo").onclick = async () => {
    const msgs = [];
    const pad = Number($("#pvPad").value || 0);
    const sys = $("#pvSys").value + (pad ? "\n" + "x".repeat(Math.round(pad * 3.8)) : "");
    if (sys.trim()) msgs.push({role: "system", content: sys});
    const text = $("#pvMsg").value;
    msgs.push({role: "user", content: $("#pvImg").checked ? [{type: "text", text}, {type: "image_url", image_url: {url: "https://example.com/a.png"}}] : text});
    if ($("#pvLoop").checked) {
      msgs.push({role: "assistant", content: null, tool_calls: [{id: "c1", type: "function", function: {name: "read_file", arguments: "{}"}}]});
      msgs.push({role: "tool", tool_call_id: "c1", content: "..."});
    }
    const body = {model: $("#pvModel").value, messages: msgs};
    if ($("#pvTools").checked || $("#pvLoop").checked) body.tools = [{type: "function", function: {name: "read_file", parameters: {type: "object"}}}];
    if ($("#pvKey").value) body.key_id = $("#pvKey").value;
    try {
      const p = await api("/route-preview", {method: "POST", body});
      const it = p.intent;
      $("#pvOut").innerHTML = `
        <h2>判定</h2><div class="row">${badge((TASK[it.task] || it.task) + " · 难度 " + it.difficulty, "acc")} ${badge("置信 " + it.confidence)} ${badge("来源 " + it.source)} ${badge("配额模式 " + p.mode)} ${p.hedge ? badge("允许对冲", "acc") : ""}
          ${it.signals.map(s => badge(s)).join(" ")}</div>
        <p class="why">估计输入 ${n(p.features.est_tokens)} tokens · 图片 ${p.features.n_images} · 声明工具 ${p.features.n_tools}${p.features.in_tool_loop ? `（本轮已走 ${p.features.loop_depth ?? 0} 步 → 影响难度）` : ""}${p.features.pinned_model ? " · 指定模型 " + esc(p.features.pinned_model) : ""}</p>
        <h2>候选排名 <span class="muted" style="font-weight:400">分数 = 质量价值 − 成本 − 等待 − 风险（美元）</span></h2>
        ${table([
          {t: "#", f: r => p.ranked.indexOf(r) + 1},
          {t: "候选", f: r => `<b>${esc(r.model)}</b><div class="why">${esc(r.channel)}</div>`},
          {t: "分数", cls: "num", f: r => `<b>${usd(r.score)}</b>`},
          {t: "质量/够用线", cls: "num", f: r => `${n(r.quality, 2)} / ${r.need}`},
          {t: "质量价值", cls: "num", f: r => usd(r.value_usd)},
          {t: "有效成本", cls: "num", f: r => usd(r.cost_usd)},
          {t: "等待", cls: "num", f: r => `${n(r.latency_s, 1)}s · ${usd(r.latency_cost_usd)}`},
          {t: "订阅压力", cls: "num", f: r => r.pressure == null ? "—" : `${pct(r.pressure)} ×${n(r.shadow_multiplier, 2)}`},
          {t: "预估 tokens", cls: "num", f: r => `<span class="mono">${n(r.est_tokens.miss)}/${n(r.est_tokens.cached)}/${n(r.est_tokens.out)}</span>`},
          {t: "credits", cls: "num", f: r => n(r.credits, 2)},
        ], p.ranked, "没有可用候选")}
        <h2>被排除</h2>${table([{t: "候选", f: r => `${esc(r.model)} <span class="why">${esc(r.channel)}</span>`}, {t: "原因", f: r => badge(r.reject, "warn")}], p.rejected, "无")}`;
    } catch (e) { toast(e.message, true); }
  };
}

/* ─────────── 学习与配置 ─────────── */
async function viewSettings(el) {
  const [{deltas, bad_rates}, cfg] = await Promise.all([api("/learning"), api("/config")]);
  CONFIG = cfg;
  const tasks = Object.entries(cfg.tasks);
  el.innerHTML = `
    <div class="spread"><h2 style="margin:0">配置</h2><button class="btn primary" id="reload">重载配置文件</button></div>
    <p class="muted">修改 <span class="mono">config/upstreams.yaml</span> 或 <span class="mono">config/policy.yaml</span> 后点这里生效；配置有误时不会生效，并提示错误。</p>
    <h2>隐式反馈学习</h2>
    <p class="muted">同一会话 3 分钟内重新生成同一个问题，会给上次那个模型在这类任务上扣一点分；正常完成会缓慢回升。幅度有上限。</p>
    ${table([{t: "模型", f: r => esc(r.model)}, {t: "任务", f: r => TASK[r.task] || r.task}, {t: "质量修正", cls: "num", f: r => badge((r.delta > 0 ? "+" : "") + r.delta, r.delta < 0 ? "warn" : "ok")}], deltas, "还没有修正")}
    <h2>验证器：答错的代价</h2>
    <p class="muted">本地结构检查（工具参数是否合 schema、要求 JSON 时是否合法、代码块能否解析）判定的"坏回答"比率，
      直接作为风险成本计入路由打分：坏比率 × (质量价值 + 成本 + 等待)。样本少时贴近 3% 的先验，不扰动路由。</p>
    ${table([
      {t: "模型", f: r => esc(r.model)},
      {t: "任务", f: r => TASK[r.task] || r.task},
      {t: "样本", cls: "num", f: r => n(r.n, 1)},
      {t: "判坏", cls: "num", f: r => n(r.bad, 1)},
      {t: "坏比率", cls: "num", f: r => badge(pct(r.rate), r.rate > 0.2 ? "bad" : r.rate > 0.08 ? "warn" : "ok")},
    ], bad_rates || [], "还没有样本（全部按 3% 先验计）")}
    <h2>任务价值表</h2>
    ${table([
      {t: "任务", f: ([k]) => `<b>${TASK[k] || k}</b>`},
      {t: "够用线 (1/2/3)", f: ([, t]) => `<span class="mono">${t.need.join(" / ")}</span>`},
      {t: "每分质量值 $", f: ([, t]) => `<span class="mono">${t.usd_per_point.join(" / ")}</span>`},
      {t: "每秒等待 $", f: ([, t]) => `<span class="mono">${t.usd_per_sec}</span>`},
      {t: "首 token 超时", cls: "num", f: ([, t]) => t.first_token_timeout_s + " s"},
    ], tasks)}
    <h2>模型质量先验</h2>
    ${table([
      {t: "模型", f: m => `<b>${esc(m.display)}</b>${m.tier === "pro" ? " " + badge("pro", "acc") : ""}`},
      ...["utility", "chat", "code", "agent", "reason", "vision", "long"].map(t => ({t: TASK[t], cls: "num", f: m => m.quality[t] ?? "—"})),
      {t: "上下文", cls: "num", f: m => n(m.context)},
    ], cfg.models)}`;
  $("#reload").onclick = async () => {
    try { const r = await api("/reload", {method: "POST"}); toast("已重载，可用候选 " + r.offers.length + " 个"); r.warnings.forEach(w => toast(w, true)); CONFIG = await api("/config"); }
    catch (e) { toast(e.message, true); }
  };
}

/* ─────────── 路由 ─────────── */
const VIEWS = {overview: viewOverview, keys: viewKeys, channels: viewChannels, requests: viewRequests, preview: viewPreview, settings: viewSettings};
const AUTO_REFRESH = new Set(["overview", "channels"]);
async function render() {
  const el = $("#main");
  try { await VIEWS[VIEW](el); } catch (e) { if (e.message !== "需要登录") el.innerHTML = `<div class="warnbox">${esc(e.message)}</div>`; }
}
$("#nav").onclick = e => {
  const b = e.target.closest("button[data-v]"); if (!b) return;
  document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("active", x === b));
  VIEW = b.dataset.v; $("#main").innerHTML = '<div class="empty">加载中…</div>'; delete $("#main").dataset.key; render();
};
async function boot() {
  try { const me = await api("/me"); $("#ver").textContent = "v" + me.version; CONFIG = await api("/config"); }
  catch { return; }
  render();
  clearInterval(timer);
  timer = setInterval(() => { if (AUTO_REFRESH.has(VIEW) && !$("#dlg").open && document.visibilityState === "visible") render(); }, 10000);
}
boot();
</script>
</body>
</html>
